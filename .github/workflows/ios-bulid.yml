name: Build iOS IPA

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Copy web files
        run: |
          mkdir -p www
          cp index.html app.js bg.js config.js sw.js manifest.webmanifest icon.svg icon-512.png apple-touch-icon.png www/
          cp -R assets www/assets

      - name: Create iOS project
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Allow background audio
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" $PLIST || true

      - name: Build unsigned app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r Notely.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Notely-ipa
          path: Notely.ipa
