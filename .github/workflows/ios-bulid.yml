name: Build iOS IPA

on:
  push:
    branches: [main]
    paths:
      - "capacitor.config.json"
      - "package.json"
      - ".github/workflows/ios-bulid.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Copy web files
        run: |
          mkdir -p www
          cp index.html app.js bg.js config.js sw.js manifest.webmanifest icon.svg icon-512.png apple-touch-icon.png www/
          cp -R assets www/assets

      - name: Create iOS project
        run: |
          npx cap add ios
          npx cap sync ios

      - name: App icon
        run: |
          ICON=$(find ios/App/App/Assets.xcassets/AppIcon.appiconset -name "*.png" | head -1)
          sips -z 1024 1024 icon-512.png --out "$ICON"

      - name: Audio session (playback in background)
        run: |
          F=ios/App/App/AppDelegate.swift
          perl -pi -e 'print "import AVFoundation\n" if $. == 1' $F
          perl -pi -e 's#// Override point for customization after application launch\.#try? AVAudioSession.sharedInstance().setCategory(.playback, mode: .default, options: []); try? AVAudioSession.sharedInstance().setActive(true)#' $F
          grep -n "AVAudioSession" $F || echo "WARN: AppDelegate not patched"

      - name: Allow background audio
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIUserInterfaceStyle string Dark" $PLIST || true
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" $PLIST
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" $PLIST
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" $PLIST || true

      - name: Build unsigned app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr Notely.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Notely-ipa
          path: Notely.ipa

      - name: Put IPA into release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ios >/dev/null 2>&1 || gh release create ios --title "Notely для iPhone" --notes "Файл Notely.ipa. Как поставить: см. README."
          gh release upload ios Notely.ipa --clobber
