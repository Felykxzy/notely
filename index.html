<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Notely</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap">
<style>
:root{--bg:#111;--card:#222;--card2:#2b2b2b;--ink:#fff;--mute:#a9a9a9;--line:#ffffff1f;--ac:#ff7a45;--ac2:#ff3d7f;--grad:linear-gradient(135deg,var(--ac),var(--ac2));
 --glass:rgba(34,34,34,.55);--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
 --body:"Manrope",-apple-system,system-ui,"Segoe UI",sans-serif;--ease:cubic-bezier(.2,.9,.25,1.15);--pad:max(18px,var(--sl))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:600 15px/1.3 var(--body);color-scheme:dark;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;position:relative;overflow:hidden}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
input,select{font:inherit;color:inherit}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}svg.f{fill:currentColor;stroke:none}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:39;display:block;opacity:0;pointer-events:none;transition:opacity .8s}
body.fp #bg{opacity:1}#veil{display:none}
#app{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;background:var(--bg)}
/* верх */
#head{display:flex;align-items:center;gap:12px;padding:calc(12px + var(--sat)) calc(18px + var(--sr)) 8px var(--pad);flex:none}
.ava{width:40px;height:40px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;flex:none;box-shadow:0 0 0 2px #ffffff22}
.pill{display:flex;align-items:center;gap:9px;height:40px;padding:0 16px 0 13px;border-radius:999px;border:2px solid #ffffff2e;font-weight:800;font-size:16px;letter-spacing:-.01em}
.pill i{display:flex;gap:3px;align-items:center;height:20px}.pill i b{width:3px;border-radius:2px;background:#fff}
.sp{flex:1}
.ib{padding:10px;border-radius:50%;color:#fff;transition:transform .2s,background .2s}.ib:active{transform:scale(.88)}.ib:hover{background:#ffffff14}.ib.on{color:var(--ac)}
#tabs{position:relative;display:flex;gap:2px;padding:5px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6)}
#tabs .ind{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:999px;background:#ffffff26;transform:translateX(var(--tx,0px)) scale(var(--sx,1),var(--sy,1));transition:transform .55s var(--ease),width .55s var(--ease)}
.tb{position:relative;z-index:1;display:flex;align-items:center;gap:7px;padding:8px 16px;font-size:14px;border-radius:999px;color:var(--mute);transition:color .3s}
.tb.on{color:#fff}
#main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px 0 190px;-webkit-overflow-scrolling:touch}
.pg{max-width:1000px;margin:0 auto;animation:pgin .45s ease both}
@keyframes pgin{from{opacity:0;transform:translateY(14px)}}
.px{padding-left:var(--pad);padding-right:max(18px,var(--sr))}
/* баннер «Любимое» */
.likes{display:flex;align-items:center;gap:12px;height:72px;margin:10px 0 10px;border-radius:12px;background:linear-gradient(90deg,#6a1d0a,#2a1a15 75%,#222);overflow:hidden;text-align:left;width:100%;padding:0 18px 0 0;transition:transform .3s var(--ease)}
.likes:active{transform:scale(.98)}
.likes .hh{width:78px;height:100%;display:grid;place-items:center;flex:none}
.likes .hh svg{width:44px;height:44px;stroke:var(--ac);stroke-width:2.2;fill:none;filter:drop-shadow(8px 6px 0 #ff7a4533) drop-shadow(16px 12px 0 #ff7a4522)}
.likes b{font-size:18px;font-weight:800;flex:1}
.circ{width:46px;height:46px;border-radius:50%;background:#000a;display:grid;place-items:center;flex:none;transition:transform .2s}.circ:active{transform:scale(.9)}
/* плитки 2x2 */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;align-items:center;gap:10px;height:56px;padding:0 10px 0 0;border-radius:10px;background:var(--card);text-align:left;min-width:0;transition:background .2s,transform .2s}
.tile:active{transform:scale(.97)}.tile.cur{background:#3a2a22}
.tile .cv{width:56px;height:56px;border-radius:10px 0 0 10px;flex:none;position:relative}
.tile .t{min-width:0}.tile .t b,.tile .t span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile .t b{font-weight:800;font-size:14px}.tile .t span{color:var(--mute);font-size:13px;font-weight:600}
.cv{background-size:cover;background-position:center;background-color:#333}
h2{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:26px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h2 a,h2 button{font-size:14px;font-weight:700;color:#fff;opacity:.95}
.shelf{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;scroll-snap-type:x proximity}.shelf::-webkit-scrollbar{display:none}
.sq{flex:none;width:min(132px,34vw);text-align:left;scroll-snap-align:start;transition:transform .3s var(--ease)}
.sq:active{transform:scale(.97)}
.sq .cv{width:100%;aspect-ratio:1;border-radius:4px;position:relative;overflow:hidden}
.sq b{display:block;margin-top:8px;font-weight:600;color:var(--mute);font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sq b em{font-style:normal;color:#fff;font-weight:800;display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sq.cur .cv::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 3px var(--ac)}
.nt .cv{border-radius:6px;box-shadow:0 0 0 3px transparent}
.nt{width:min(132px,34vw)}
.nt .cv{outline:3px solid transparent;border:3px solid transparent;background:linear-gradient(#111,#111) padding-box,linear-gradient(135deg,#ff7a45,#ff3d7f,#a64dff) border-box;padding:0}
.nt .cv i{position:absolute;inset:0;background-size:cover;background-position:center;border-radius:3px}
.nt .cv span{position:absolute;left:10px;top:10px;font-weight:800;letter-spacing:.12em;font-size:11px;text-transform:uppercase;text-shadow:0 2px 12px #000;z-index:2}
.nt .cv::before{content:"";position:absolute;inset:0;background:linear-gradient(#0009,transparent 50%);z-index:1}
.eqm{display:none;position:absolute;right:10px;bottom:10px;gap:3px;align-items:flex-end;height:18px;z-index:3}
.cur .eqm{display:flex}.eqm i{width:4px;border-radius:2px;background:#fff;height:100%;transform-origin:bottom;animation:eqk .8s ease-in-out infinite alternate;animation-play-state:var(--pl,paused)}
.eqm i:nth-child(2){animation-delay:-.3s}.eqm i:nth-child(3){animation-delay:-.6s}
@keyframes eqk{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
.sk{height:160px;border-radius:8px;background:linear-gradient(100deg,transparent 30%,#ffffff12 50%,transparent 70%),var(--card);background-size:200% 100%;animation:skm 1.3s linear infinite}
@keyframes skm{to{background-position:-200% 0}}
.msg{background:var(--card);border-radius:12px;padding:14px;color:var(--mute);line-height:1.5;font-size:14px}
/* строки */
.row{display:grid;grid-template-columns:44px 1fr auto auto;gap:12px;align-items:center;padding:6px 0;border-radius:8px}
.row .cv{width:44px;height:44px;border-radius:6px;position:relative}
.row .t{text-align:left;min-width:0}.row .t b,.row .t span{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .t b{font-weight:800}.row .t span{color:var(--mute);font-size:12px}
.row time{color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
.row.cur .t b{color:var(--ac)}
.like{padding:10px;color:var(--mute);border-radius:50%;transition:transform .3s var(--ease),color .2s}.like.on{color:var(--ac2)}.like.pop{animation:lk .5s var(--ease)}
@keyframes lk{30%{transform:scale(1.5) rotate(-12deg)}}
.hb{position:fixed;pointer-events:none;z-index:99;font-size:18px;animation:hb 1s ease-out forwards}
@keyframes hb{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--x),-90px) scale(1.2)}}
/* поиск */
.sb{display:flex;align-items:center;gap:10px;height:44px;border-radius:10px;background:var(--card);padding:0 16px;margin:10px 0 6px}
.sb input{flex:1;min-width:0;background:none;border:0;outline:0;font-weight:600}.sb:focus-within{box-shadow:0 0 0 2px var(--ac)}
h1{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:8px 0 2px}
.gen{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g{height:70px;border-radius:10px;padding:12px;text-align:left;font-weight:800;font-size:16px;position:relative;overflow:hidden;transition:transform .25s var(--ease)}.g:active{transform:scale(.96)}
.g::after{content:"";position:absolute;right:-18px;bottom:-22px;width:78px;height:78px;border-radius:14px;background:#00000026;transform:rotate(22deg)}
.chips{display:flex;gap:8px;margin:6px 0 12px}.chip{padding:9px 18px;border-radius:999px;background:var(--card);font-weight:700;font-size:15px}.chip.on{background:#fff;color:#111}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--grad);color:#111;font-weight:800;border-radius:999px;padding:13px 24px;transition:transform .25s var(--ease)}.btn:active{transform:scale(.95)}.btn.g2{background:var(--card2);color:#fff}
/* мини-плеер */
#bar{position:fixed;left:50%;bottom:calc(86px + var(--sab));transform:translateX(-50%);width:min(960px,calc(100% - 20px));z-index:20;border-radius:12px;background:#2a2a2a;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto;align-items:center;gap:14px;padding:8px 14px 8px 8px;box-shadow:0 10px 30px -8px #000;transition:transform .5s var(--ease),opacity .4s}
#bar.hid{transform:translate(-50%,300%);opacity:0;pointer-events:none}
.now{display:flex;align-items:center;gap:12px;min-width:0;text-align:left}.now .cv{width:42px;height:42px;border-radius:6px;flex:none}
.now .t{min-width:0;overflow:hidden}.now .t b,.now .t span{display:block;white-space:nowrap}.now .t b{font-weight:800;font-size:14px}.now .t span{color:var(--mute);font-size:12px}
.mq{display:inline-block}.mq.run{animation:mq 9s linear infinite;padding-right:40px}@keyframes mq{to{transform:translateX(-50%)}}
.ctl{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}.bt{display:flex;align-items:center;gap:12px}
.pp{width:40px;height:40px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;transition:transform .25s var(--ease)}.pp:active{transform:scale(.9)}
.sk2{width:100%;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:5px;border-radius:9px;background:linear-gradient(90deg,#fff var(--p,0%),#ffffff33 var(--p,0%));cursor:pointer;min-width:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#fff;border:0}
.vol{display:flex;align-items:center;gap:8px}.vol input{width:90px}
.mprog{display:none}
/* полный плеер */
#full{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:calc(20px + var(--sat)) 28px calc(24px + var(--sab));background:#0b0b0bd9;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);clip-path:circle(0 at 50% 100%);visibility:hidden;transition:clip-path .7s cubic-bezier(.7,0,.2,1),visibility 0s .7s}
#full.on{clip-path:circle(150% at 50% 100%);visibility:visible;transition:clip-path .8s cubic-bezier(.7,0,.2,1)}
#full .cl{position:absolute;top:calc(14px + var(--sat));right:18px}
#full .cv{position:relative;z-index:0;width:min(86vw,54vh,460px);aspect-ratio:1;border-radius:14px;opacity:0;transition:opacity .8s ease .2s}
#full.on .cv{opacity:1}
#full .cv::before{content:"";position:absolute;inset:-7%;z-index:-1;border-radius:24px;background:inherit;background-size:cover;background-position:center;filter:blur(38px) saturate(1.7) brightness(1.1);opacity:.9}
#full .cv::after{content:"";position:absolute;inset:-26%;z-index:-2;border-radius:50%;background:inherit;background-size:cover;background-position:center;filter:blur(90px) saturate(1.8);opacity:.45}
#full .t{text-align:center;max-width:90%}#full .t b{font-size:clamp(20px,4vw,28px);letter-spacing:-.02em;display:block;line-height:1.15;font-weight:800}#full .t span{color:var(--mute)}
#full .sk2{width:min(520px,100%)}#full .bt{gap:24px}#full .pp{width:64px;height:64px}
.bars{display:flex;gap:4px;align-items:flex-end;height:30px}.bars i{width:5px;border-radius:3px;background:var(--grad);height:100%;transform-origin:bottom;transform:scaleY(.15);animation:eqk .9s ease-in-out infinite alternate;animation-play-state:var(--pl,paused)}
#ytw{position:fixed;z-index:45;right:16px;bottom:calc(150px + var(--sab));width:240px;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;box-shadow:0 14px 40px -10px #000,0 0 0 1px var(--line);transition:all .6s var(--ease)}
#ytw iframe,#ytw>div{width:100%;height:100%;display:block;border:0}
#ytw.big{right:50%;bottom:50%;transform:translate(50%,calc(50% - 90px));width:min(88vw,720px);border-radius:16px;z-index:46}
#set{position:fixed;inset:0;z-index:60;background:#000b;display:none;align-items:center;justify-content:center;padding:16px}#set.on{display:flex}
#set>div{border-radius:18px;padding:22px;width:100%;max-width:460px;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px;background:#1e1e1e;border:1px solid var(--line);animation:pgin .35s ease}
#set h2{margin:0;font-size:24px}
#set label{display:flex;flex-direction:column;gap:6px;color:var(--mute);font-size:13px}#set input,#set select{background:#2a2a2a;border:1px solid var(--line);border-radius:10px;padding:12px;color:#fff}#set a{color:var(--ac)}
#toast{position:fixed;left:50%;top:calc(76px + var(--sat));transform:translate(-50%,-20px) scale(.9);padding:10px 18px;border-radius:999px;background:#333;opacity:0;transition:.4s var(--ease);z-index:70;pointer-events:none;max-width:90vw;text-align:center;font-size:14px}#toast.on{opacity:1;transform:translate(-50%,0)}
.rpl{position:absolute;border-radius:50%;background:#ffffff40;transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}@keyframes rp{to{transform:scale(2.6);opacity:0}}
/* компьютер: вкладки вверху */
@media (min-width:761px){#head{padding-right:max(24px,var(--sr))}#tabs{position:absolute;left:50%;transform:translateX(-50%)}#bar{bottom:calc(16px + var(--sab))}#ytw{bottom:calc(86px + var(--sab))}.tiles{grid-template-columns:repeat(4,1fr)}.gen{grid-template-columns:repeat(4,1fr)}.tile{height:62px}.tile .cv{width:62px;height:62px}.sq{width:170px}.nt{width:180px}#main{padding-bottom:130px}}
/* телефон: стеклянные вкладки внизу */
@media (max-width:760px){
 #tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + var(--sab));z-index:30;padding:5px;justify-content:space-between;touch-action:pan-y;user-select:none;-webkit-user-select:none;
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04)),rgba(30,30,30,.4);backdrop-filter:blur(22px) saturate(2.1) brightness(1.1);-webkit-backdrop-filter:blur(22px) saturate(2.1) brightness(1.1);border:1px solid rgba(255,255,255,.18);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.08),0 22px 44px -16px rgba(0,0,0,.8)}
 .tb{flex:1;flex-direction:column;gap:2px;padding:9px 4px 8px;font-size:12px;font-weight:700;justify-content:center;color:rgba(255,255,255,.78)}
 .tb.on{color:#fff}.tb svg{width:25px;height:25px}
 #tabs .ind{top:3px;bottom:3px;background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.07) 60%,rgba(255,255,255,.14));backdrop-filter:blur(4px) saturate(2.4) brightness(1.3);-webkit-backdrop-filter:blur(4px) saturate(2.4) brightness(1.3);
  box-shadow:inset 0 1.5px 1px rgba(255,255,255,.8),inset 0 -1.5px 2px rgba(255,255,255,.3),inset 0 0 16px rgba(255,255,255,.18),0 8px 22px -6px rgba(0,0,0,.55);transition:transform .6s cubic-bezier(.2,1.2,.3,1),width .6s cubic-bezier(.2,1.2,.3,1)}
 #tabs.press .ind{--sy:1.16;transition:transform .12s linear,width .3s}#tabs.press .tb.on svg{transform:scale(1.3)}
 .tb svg{transition:transform .4s var(--ease)}
 #bar{grid-template-columns:minmax(0,1fr) auto;padding:7px 12px 7px 7px;overflow:hidden}
 .ctl .sk2,.ctl .bt .opt,.vol{display:none}.pp{width:42px;height:42px}
 .mprog{display:block;position:absolute;left:0;right:0;bottom:0;height:3px;background:#ffffff26}.mprog i{display:block;height:100%;width:var(--mp,0%);background:#fff}
 #ytw{width:170px;bottom:calc(150px + var(--sab));right:12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Звук YouTube играет, а видео скрыто: на экране только обложка */
#ytw:not(.vid),#ytw.mini:not(.vid),#ytw.big:not(.vid){position:fixed!important;left:0!important;top:0!important;right:auto!important;bottom:auto!important;transform:none!important;width:2px!important;height:2px!important;aspect-ratio:auto!important;opacity:0!important;pointer-events:none!important;border-radius:0!important;box-shadow:none!important;overflow:hidden!important;z-index:-1!important}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas><div id="veil"></div>
<div id="app">
  <header id="head">
    <button class="ava" id="setB" aria-label="Настройки">N</button>
    <div class="pill"><i><b style="height:8px"></b><b style="height:16px"></b><b style="height:11px"></b><b style="height:18px"></b></i>Notely</div>
    <nav id="tabs" aria-label="Разделы"><div class="ind" id="ind"></div>
      <button class="tb on" data-v="home"><svg class="i f" viewBox="0 0 24 24"><path d="M12 2.5l9.500 8v10a1.500 1.500 0 0 1-1.500 1.500h-5v-7h-6v7H4a1.500 1.500 0 0 1-1.500-1.500v-10z"/></svg><span>Главная</span></button>
      <button class="tb" data-v="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span>Поиск</span></button>
      <button class="tb" data-v="lib"><svg class="i" viewBox="0 0 24 24"><path d="M5 4v16M10 4v16M15 5l4 15"/></svg><span>Библиотека</span></button>
    </nav>
    <div class="sp"></div>
  </header>
  <main id="main"></main>
</div>
<footer id="bar" class="hid" aria-label="Плеер">
  <button class="now" id="nowB" aria-label="Открыть плеер"><div class="cv" id="bCv"></div><div class="t"><b><span class="mq" id="bT"></span></b><span id="bA"></span></div></button>
  <div class="ctl"><div class="bt">
    <button class="ib opt" id="shB" aria-label="Перемешать"><svg class="i" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
    <button class="ib opt" id="prB" aria-label="Назад"><svg class="i f" viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button class="pp" id="ppB" aria-label="Играть"><svg class="i f" viewBox="0 0 24 24" id="ppI"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="ib" id="nxB" aria-label="Вперёд"><svg class="i f" viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    <button class="ib opt" id="rpB" aria-label="Повтор"><svg class="i" viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg></button>
  </div><div class="sk2"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Перемотка"><span id="dur">0:00</span></div></div>
  <div class="vol"><svg class="i" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4zM15.500 8.500a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/></svg><input type="range" id="vol" min="0" max="100" value="80" aria-label="Громкость"></div>
